<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>PROJECT PHOTON</title>
    <style>
      :root {
        --photon-bg: #05060a;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--photon-bg);
        color: #e8f4ff;
        font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 12px;
        justify-items: center;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        font-size: 13px;
        color: #4de3ff;
        background: radial-gradient(circle at 50% 45%, #0b1626 0%, #05060a 70%);
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Photon &middot; booting</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
