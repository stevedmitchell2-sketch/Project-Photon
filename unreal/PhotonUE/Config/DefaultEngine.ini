[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Photon.PhotonGameMode

[/Script/Engine.RendererSettings]
; Lumen + virtual shadow maps are a large part of why this spike exists: the Three.js build
; hand-rolled world-space UVs, procedural normals and 19 manually placed lights to approximate
; what these two settings give directly.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure=False
; Bloom stays deliberately restrained. The reference build's failure mode was everything glowing,
; at which point nothing reads as glowing.
r.DefaultFeature.Bloom=True
r.BloomQuality=5

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-1470.0
