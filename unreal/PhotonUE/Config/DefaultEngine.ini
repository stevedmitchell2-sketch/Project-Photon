ManualIPAddress=


[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Lumen and Virtual Shadow Maps both REQUIRE Shader Model 6. Enabling them in
; [/Script/Engine.RendererSettings] without also targeting SM6 here is what rendered the world
; black: the editor reported "Shader Model 6 (SM6) is required to use Virtual Shadow Maps" and the
; entire lighting path was unavailable. The black screen was never a camera or spawn problem — the
; editor viewport was black too, which is what ruled those out.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D12TargetedShaderFormats=PCD3D_SM5

[/Script/Engine.RendererSettings]
; Auto exposure was disabled without any manual exposure being set, which floors the image on its
; own. Re-enabled with a fixed range so brightness is predictable rather than drifting.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.AutoExposure.MinBrightness=0.6
r.AutoExposure.MaxBrightness=1.4

[/Script/Engine.RendererSettings]
; Lumen's software ray tracing traces against mesh distance fields, and those are not generated
; unless asked for. Without them Lumen reports "no ray tracing data and won't operate correctly" and
; contributes no lighting at all — the second layer of the black screen, revealed only after SM6 was
; fixed. Hardware ray tracing is the alternative; distance fields are the safer default because they
; do not depend on the GPU supporting RT.
r.GenerateMeshDistanceFields=True
r.Lumen.TraceMeshSDFs=1
r.DistanceFieldBuild.EightBit=True
