[/Script/Engine.InputSettings]
; Enhanced Input owns the real bindings (see Tools/bootstrap_stage0.py, which authors the
; InputActions and the IMC). This file only keeps the legacy system from fighting it.
bAlwaysShowTouchInterface=False
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture

; Without these the pawn receives a plain UInputComponent and every BindAction is silently dropped —
; observed as "input setup failed: EIC=0" while the mapping context itself was correctly registered.
; Enabling the EnhancedInput plugin is not sufficient; these classes have to be selected explicitly.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
